name: "ci"

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    with:
      ruby_version: "3.2"
      # puppet_litmus -> bolt 4.x -> faraday-patron -> patron builds a libcurl native extension;
      # the runner has no libcurl headers, so install them before bundle (Puppet 9 lane, Ruby 4).
      additional_packages: "libcurl4-openssl-dev"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    with:
      ruby_version: "3.2"
      # --nightly rather than --latest-agent: Puppet 9 has not GA'd, so no puppet-agent 9.x is
      # published on the forge and --latest-agent resolves the Puppet 9 collection to a null
      # version. The nightly repos do carry a Puppet 9 agent.
      flags: "--nightly"
    secrets: "inherit"
